name: Payment fix one-shot

on:
  push:
    branches:
      - chappy/fix-advance-payment-cycle-20260825

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chappy/fix-advance-payment-cycle-20260825
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply source patch
        run: node scripts/apply-payment-advance-fix.mjs
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm check
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routers.ts client/src/pages/AppPayments.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix(payments): correct advance direction fee and payment cycle"
          git push origin HEAD:chappy/fix-advance-payment-cycle-20260825
