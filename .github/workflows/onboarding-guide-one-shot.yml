name: Onboarding guide one-shot

on:
  push:
    branches:
      - chappy/onboarding-guide-v1

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: citest
          MARIADB_DATABASE: juchou_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chappy/onboarding-guide-v1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply integration patch
        run: |
          node scripts/apply-onboarding-guide-v1.mjs
          node scripts/register-onboarding-migration.mjs
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate migrations
        env:
          DATABASE_URL: mysql://root:citest@127.0.0.1:3306/juchou_ci
        run: node scripts/migrate.mjs
      - name: Typecheck
        run: pnpm check
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Commit integrated sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle/schema.ts drizzle/meta/_journal.json server/routers.ts server/guideState.ts client/src/components/AppLayout.tsx client/src/components/AppGuideCenter.tsx CLAUDE.md
          git diff --cached --quiet && exit 0
          git commit -m "feat(guide): integrate role onboarding and update notices"
          git push origin HEAD:chappy/onboarding-guide-v1
