name: Update in-app guide feed

on:
  push:
    branches: [main]
    paths-ignore:
      - "client/src/generated/appUpdates.ts"
      - "**/*.md"

permissions:
  contents: write

concurrency:
  group: app-guide-feed-main
  cancel-in-progress: false

jobs:
  update-feed:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Generate change feed entry
        run: node scripts/update-app-guide-feed.mjs
      - name: Commit generated feed when changed
        run: |
          if git diff --quiet -- client/src/generated/appUpdates.ts; then
            echo "No user-facing guide update needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/generated/appUpdates.ts
          git commit -m "chore(guide): update in-app change feed [guide-feed]"
          git push origin HEAD:main
