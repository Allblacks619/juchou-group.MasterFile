name: Early payment labels one-shot

on:
  push:
    branches:
      - chappy/rename-early-payment-20260826

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chappy/rename-early-payment-20260826
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply labels patch
        run: node scripts/apply-early-payment-labels.mjs
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm check
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/AppPayments.tsx
          git diff --cached --quiet && exit 0
          git commit -m "refactor(payments): rename advance flow to early payment"
          git push origin HEAD:chappy/rename-early-payment-20260826
